name: NexusAkari Pro — Rust + Tauri 2 & Windows Desktop Installer CI

on:
  push:
    branches: [main, master, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ts-math-and-web-build:
    name: TypeScript v4 Math, External API & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Strict Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run Deterministic v4 Math Engine & External API Unit Tests (node:test)
        run: npx --yes tsx --test src/core/mathEngine.test.ts

      - name: Build Production Frontend Bundle
        run: npm run build

  rust-tauri-kernel-test:
    name: Rust + Tauri 2 Kernel Unit Tests & Clippy Audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tauri 2 System Dependencies (Ubuntu WebKit2GTK 4.1)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Rust Stable Toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare frontendDist Directory for tauri::generate_context! Macro
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo "<!doctype html><html><head><title>NexusAkari Pro</title></head><body></body></html>" > dist/index.html
          fi

      - name: Run Rust Core Unit Tests (SafeBan FSM, WAMP Prefix Filter, TokenBucket, Bench Sniper)
        working-directory: ./src-tauri
        run: cargo test -- --nocapture

      - name: Run Cargo Clippy Static Analysis
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

  windows-desktop-installer:
    name: Build Ultra-Slim (<5MB) Pure Rust Tauri 2 Windows x64 Installers
    needs: [ts-math-and-web-build, rust-tauri-kernel-test]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable Toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies & Build Frontend Dist
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build Official Tauri 2 Native NSIS & MSI Installers (@tauri-apps/cli@2)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis,msi

      - name: Smoke-Test Stripped Native Tauri 2 Executable
        shell: pwsh
        run: |
          ./src-tauri/target/release/nexus-akari-pro.exe --smoke-test

      - name: Stage Pure Rust Tauri 2 NSIS, MSI & Portable Bundles (Zero node.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-nsis" | Out-Null
          New-Item -ItemType Directory -Force -Path "release-msi-portable" | Out-Null

          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release-nsis/NexusAkari-Pro-v4.0.0-Windows-x64-Setup.exe" -Force
          }
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release-msi-portable/NexusAkari-Pro-v4.0.0-Windows-x64.msi" -Force
          }

          Compress-Archive -Path "src-tauri/target/release/nexus-akari-pro.exe" -DestinationPath "release-msi-portable/NexusAkari-Pro-v4.0.0-Windows-x64-Portable.zip" -Force

          Write-Host "=== NSIS Setup Installer (~3-4 MB) ==="
          Get-ChildItem release-nsis | Format-Table Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length / 1MB, 2)}} -AutoSize

          Write-Host "=== MSI & Portable Executable (~3-5 MB) ==="
          Get-ChildItem release-msi-portable | Format-Table Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length / 1MB, 2)}} -AutoSize

      - name: Upload Ultra-Slim Tauri 2 NSIS Setup.exe (~3MB)
        uses: actions/upload-artifact@v4
        with:
          name: NexusAkari-Pro-v4.0.0-Windows-x64-Installer
          path: release-nsis/NexusAkari-Pro-v4.0.0-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Tauri 2 MSI & Portable Bundle (~4MB)
        uses: actions/upload-artifact@v4
        with:
          name: NexusAkari-Pro-v4.0.0-Windows-x64-MSI-and-Portable
          path: |
            release-msi-portable/NexusAkari-Pro-v4.0.0-Windows-x64.msi
            release-msi-portable/NexusAkari-Pro-v4.0.0-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 30
