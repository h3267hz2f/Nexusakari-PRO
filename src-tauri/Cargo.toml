[package]
name = "nexus-akari-pro"
version = "4.0.0"
description = "NexusAkari Pro (v4) — Rust + Tauri 2 Tri-Channel Tactical & LCU/SGP Bridge Engine"
authors = ["NexusAkari Architecture Team"]
edition = "2021"

[lib]
name = "nexus_akari_pro_lib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time"] }
dashmap = "6.1"
base64 = "0.22"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
